plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.vendicated.alphacord'
    compileSdk 36

    defaultConfig {
        applicationId "dev.vendicated.alphacord"
        minSdk 21
        targetSdk 36
        versionCode 3
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dbg"
        }

        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
}

