name: Build debug APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Apply patch
        run: |
          if [ -f vendroid-injection-fix.patch ]; then
            git apply vendroid-injection-fix.patch
          fi

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleDebug

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debug-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Debug build ${{ github.run_number }}" --prerelease
